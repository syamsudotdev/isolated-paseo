# Image-owned configuration. Keep this file outside mounted home and workspace paths.
[tools]
node = "24.21.0"
java = "temurin-25.0.4+101.0.LTS"
go = "1.27.1"
rust = "1.99.0"
python = "3.14.8"
uv = "0.12.23"
gh = "2.102.0"
azure = "2.90.0"
rtk = "0.51.0"
fd = "10.5.0"
ripgrep = "15.2.0"
android-cli = "1.0.16500706"
android-sdk = "23.0"
# Adoptium maps 25.0.4+101.0.LTS to OpenJDK 25.0.4.1+1-LTS.

[tasks.apps]
run = "cd /opt/toolchain/apps && npm ci --omit=dev"

[tasks.android-sdk]
run = "yes | sdkmanager --sdk_root=/opt/toolchain/android-sdk 'platform-tools' 'platforms;android-37.2' 'build-tools;37.0.0'"
